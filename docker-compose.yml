services:
  zookeeper:
    image: zookeeper:3.8.4
    container_name: lothuspay-zookeeper-2
    restart: always
    ports:
      - "2182:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.3
    container_name: lothuspay-kafka-2
    restart: always
    ports:
      - "9093:9092"
    environment:
      - KAFKA_BROKER_ID=1
      - KAFKA_ZOOKEEPER_CONNECT=zookeeper:2181
      - KAFKA_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://:9092
      - KAFKA_ADVERTISED_LISTENERS=INTERNAL://kafka:29092,EXTERNAL://localhost:9093
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    depends_on:
      - zookeeper

  auth-api:
    image: ghcr.io/lothuspay/auth-api:latest
    pull_policy: always
    container_name: lothuspay-auth-2
    environment:
      - SPRING_APPLICATION_NAME=auth-service
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb+srv://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_URL}/lothuspay_auth?retryWrites=true&w=majority&appName=LothusPay
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    expose:
      - "8080"
    depends_on:
      - kafka

  wallet-api:
    image: ghcr.io/lothuspay/wallet-api:latest
    pull_policy: always
    container_name: lothuspay-wallet-2
    environment:
      - SPRING_APPLICATION_NAME=wallet-service
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb+srv://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_URL}/lothuspay_wallet?retryWrites=true&w=majority&appName=LothusPay
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=wallet-service
    expose:
      - "8080"
    depends_on:
      - kafka

  payments-api:
    image: ghcr.io/lothuspay/payments-api:latest
    pull_policy: always
    container_name: lothuspay-payments-2
    environment:
      - SPRING_APPLICATION_NAME=payments-service
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb+srv://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_URL}/lothuspay_payments?retryWrites=true&w=majority&appName=LothusPay
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=payments-service
    expose:
      - "8080"
    depends_on:
      - kafka

  email-api:
    image: ghcr.io/lothuspay/email-api:latest
    pull_policy: always
    container_name: lothuspay-email-2
    environment:
      - SPRING_APPLICATION_NAME=email-service
      - SERVER_PORT=8080
      - SPRING_DATA_MONGODB_URI=mongodb+srv://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_URL}/lothuspay_emails?retryWrites=true&w=majority&appName=LothusPay
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
      - SPRING_KAFKA_CONSUMER_GROUP_ID=email-service
      - RESEND_API_KEY=${RESEND_API_KEY}
    expose:
      - "8080"
    depends_on:
      - kafka

  gateway-api:
    image: ghcr.io/lothuspay/gateway-api:latest
    pull_policy: always
    container_name: lothuspay-gateway-2
    ports:
      - "4401:8080"
    environment:
      - SERVER_PORT=8080
      - SPRING_APPLICATION_NAME=gateway-api
      - AUTH_SERVICE_URL=http://auth-api:8080
      - WALLET_SERVICE_URL=http://wallet-api:8080
      - PAYMENTS_SERVICE_URL=http://payments-api:8080
      - EMAIL_SERVICE_URL=http://email-api:8080
      - SPRING_DATA_MONGODB_URI=mongodb+srv://${DATABASE_USERNAME}:${DATABASE_PASSWORD}@${DATABASE_URL}/lothuspay_gateway?retryWrites=true&w=majority&appName=LothusPay
      - INTERNAL_SECRET=${INTERNAL_SECRET}
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:29092
    depends_on:
      - auth-api
      - wallet-api
      - payments-api
      - kafka

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: lothuspay-cloudflared-2
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    environment:
      - TUNNEL_TRANSPORT_PROTOCOL=quic
    depends_on:
      - gateway-api
