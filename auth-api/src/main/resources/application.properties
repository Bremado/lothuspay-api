spring.application.name=auth-service

server.port=8081
application.security.jwt.secret-key=d9e3a6c7821f904dc66b3c4e5f87b12f5bf0c9e324d7720c4fe9a814c3e52b9f44cbd1d61c09eaa75d2769b47d0e3c6a2d7f0b3c9ce5e8f73ac8bf1f0c93a21d
application.security.jwt.expiration=86400000

logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.web.servlet.DispatcherServlet=DEBUG
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG


r2.endpoint=https://yourr2.r2.cloudflarestorage.com
r2.bucket=bucket-name
r2.access-key=access-key
r2.secret-key=secret-key

internal.secret=${INTERNAL_SECRET}

spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS}

spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer

spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
